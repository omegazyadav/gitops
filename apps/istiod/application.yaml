apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio
  namespace: argocd
  labels:
    tier: istio
spec:
  project: default
  source:
    repoURL: https://github.com/omegazyadav/gitops.git
    targetRevision: main
    path: apps/istiod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
