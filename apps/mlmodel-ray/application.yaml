apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlmodel-ray
  namespace: argocd
  labels:
    tier: mlmodel
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/omegazyadav/gitops.git
    targetRevision: main
    path: helm/mlmodel-ray
    helm:
      valueFiles:
        - values.yaml
      values: |
        namespace:
          create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
