apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    # Controls ordering only when multiple apps sync at once (e.g. the
    # first time the whole stack is bootstrapped) - higher-wave apps wait
    # for lower-wave ones. Each app is still fully independent: you can
    # sync, pause, or delete this Application on its own at any time
    # without affecting the others (see README in argocd-apps/).
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/omegazyadav/otel-demo.git
    targetRevision: main
    path: helm/prometheus
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
