apiVersion: v1
kind: Secret
metadata:
  name: otel-db-secrets
type: Opaque
stringData:
  DB_PASSWORD: "password"
  DB_DSN: "host=postgres user=user password=password dbname=notesdb port=5432 sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-secret
type: Opaque
stringData:
  # Replace with your real Slack incoming webhook URL
  # Fetch the slack webhook from https://api.slack.com/apps
  slack-api-url: "slack-webhook-url"
