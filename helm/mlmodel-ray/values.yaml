# Default values for mlmodel-ray.

nameOverride: ""
fullnameOverride: ""

# Set create: false to deploy into a namespace managed outside this chart.
namespace:
  create: false
  name: mlops

image:
  repository: docker.io/omegazyadav/mlmodel
  # Must be a tag that has ray[serve] baked in, and the model artifacts each
  # serve.applications[].modelPath below points at (published from the mlops repo).
  tag: "sha-0a48d86"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Must match the `ray` package version installed in the image.
rayVersion: "2.58.0"

# Ray Serve config (rendered into RayService's serveConfigV2). Each entry in
# `applications` is deployed as its own independent Serve application -
# a different model, or a different version of the same model - every one
# bound to app.ray_serve:entrypoint with its own model_path, route_prefix,
# and autoscaling_config, so they scale independently of each other.
serve:
  # EveryNode runs a Serve HTTP proxy on every Ray node (required for KubeRay's
  # default worker readiness probe, which checks localhost:8000/-/healthz).
  proxyLocation: EveryNode
  applications:
    - name: random-forest-1-0-0
      modelPath: /app/model/model.joblib
      routePrefix: /random-forest-1-0-0
      deploymentName: MLModelDeployment
      autoscaling:
        minReplicas: 1
        maxReplicas: 4
        targetOngoingRequests: 5
    - name: random-forest-2-0-0
      modelPath: /app/model/random_forest-2-0-0.joblib
      routePrefix: /random-forest-2-0-0
      deploymentName: MLModelDeployment
      autoscaling:
        minReplicas: 1
        maxReplicas: 4
        targetOngoingRequests: 5
    - name: logistic-regression-1-0-0
      modelPath: /app/model/logistic_regression-1-0-0.joblib
      routePrefix: /logistic-regression-1-0-0
      deploymentName: MLModelDeployment
      autoscaling:
        minReplicas: 1
        maxReplicas: 2
        targetOngoingRequests: 5

env:
  # MODEL_PATH is no longer used by app.ray_serve (model_path is now passed
  # per-application via serve.applications[].modelPath -> args.model_path).
  PYTHONPATH: /app

head:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
  rayStartParams:
    dashboard-host: "0.0.0.0"

# Wires the Ray Dashboard's embedded Grafana panels + Prometheus queries.
# grafanaHost is used server-side (by the Ray head) to validate Grafana is reachable
# and to build panel query URLs; grafanaIframeHost is what the browser loads iframes from
# (only needed if it differs from grafanaHost, e.g. behind an ingress).
dashboard:
  grafanaHost: http://grafana.grafana.svc.cluster.local:80
  grafanaIframeHost: http://grafana.localhost:9999
  prometheusHost: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

worker:
  groupName: worker-group
  replicas: 1
  minReplicas: 1
  maxReplicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  rayStartParams: {}

nodeSelector: {}
tolerations: []
affinity: {}

istio:
  enabled: false
  host: mlmodel-ray.localhost
