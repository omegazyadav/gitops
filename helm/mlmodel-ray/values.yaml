# Default values for mlmodel-ray.

nameOverride: ""
fullnameOverride: ""

# Set create: false to deploy into a namespace managed outside this chart.
namespace:
  create: false
  name: mlops

image:
  repository: docker.io/omegazyadav/mlmodel
  # Must be a tag that has ray[serve] baked in (published from the mlops repo).
  tag: "sha-803b541"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Must match the `ray` package version installed in the image.
rayVersion: "2.58.0"

# Ray Serve application config (rendered into RayService's serveConfigV2).
serve:
  appName: mlmodel
  importPath: app.ray_serve:entrypoint
  routePrefix: /
  deploymentName: MLModelDeployment
  # EveryNode runs a Serve HTTP proxy on every Ray node (required for KubeRay's
  # default worker readiness probe, which checks localhost:8000/-/healthz).
  proxyLocation: EveryNode
  autoscaling:
    minReplicas: 1
    maxReplicas: 4
    targetOngoingRequests: 5

env:
  MODEL_PATH: /app/model/model.joblib
  PYTHONPATH: /app

head:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  rayStartParams:
    dashboard-host: "0.0.0.0"

# Wires the Ray Dashboard's embedded Grafana panels + Prometheus queries.
# grafanaHost is used server-side (by the Ray head) to validate Grafana is reachable
# and to build panel query URLs; grafanaIframeHost is what the browser loads iframes from
# (only needed if it differs from grafanaHost, e.g. behind an ingress).
dashboard:
  grafanaHost: http://grafana.grafana.svc.cluster.local:80
  grafanaIframeHost: http://grafana.localhost:9999
  prometheusHost: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

worker:
  groupName: worker-group
  replicas: 1
  minReplicas: 1
  maxReplicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  rayStartParams: {}

nodeSelector: {}
tolerations: []
affinity: {}
