nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  name: mlops

image:
  repository: docker.io/omegazyadav/mlmodel
  tag: "sha-541598a"
  pullPolicy: IfNotPresent

imagePullSecrets: []

rayVersion: "2.58.0"

serve:
  # EveryNode runs a Serve HTTP proxy on every Ray node (required for KubeRay's
  # default worker readiness probe, which checks localhost:8000/-/healthz).
  proxyLocation: EveryNode
  applications:
    - name: random-forest-1-0-0
      modelPath: /app/model/random_forest-1-0-0.joblib
      routePrefix: /random-forest-1-0-0
      deploymentName: MLModelDeployment
      autoscaling:
        minReplicas: 1
        maxReplicas: 4
        targetOngoingRequests: 5
    - name: random-forest-1-0-1
      modelPath: /app/model/random_forest-1-0-1.joblib
      routePrefix: /random-forest-1-0-1
      deploymentName: MLModelDeployment
      autoscaling:
        minReplicas: 1
        maxReplicas: 4
        targetOngoingRequests: 5
    - name: random-forest-2-0-0
      modelPath: /app/model/random_forest-2-0-0.joblib
      routePrefix: /random-forest-2-0-0
      deploymentName: MLModelDeployment
      autoscaling:
        minReplicas: 1
        maxReplicas: 4
        targetOngoingRequests: 5
    - name: logistic-regression-1-0-0
      modelPath: /app/model/logistic_regression-1-0-0.joblib
      routePrefix: /logistic-regression-1-0-0
      deploymentName: MLModelDeployment
      autoscaling:
        minReplicas: 1
        maxReplicas: 2
        targetOngoingRequests: 5

env:
  PYTHONPATH: /app

head:
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
  rayStartParams:
    dashboard-host: "0.0.0.0"

# Wires the Ray Dashboard's embedded Grafana panels + Prometheus queries.
# grafanaHost is used server-side (by the Ray head) to validate Grafana is reachable
# and to build panel query URLs; grafanaIframeHost is what the browser loads iframes from
# (only needed if it differs from grafanaHost, e.g. behind an ingress).
dashboard:
  grafanaHost: http://grafana.grafana.svc.cluster.local:80
  grafanaIframeHost: http://grafana.localhost:9999
  prometheusHost: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090

worker:
  groupName: worker-group
  replicas: 1
  minReplicas: 1
  maxReplicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  rayStartParams: {}

nodeSelector: {}
tolerations: []
affinity: {}

istio:
  enabled: false
  host: mlmodel-ray.localhost
  # Optional suffix appended to each serve-app hostname, e.g. "1-2-0" ->
  # random-forest-1-0-0-1-2-0.mlmodel-ray.localhost. Lets multiple independent
  # *releases* (not model versions) of the same family coexist on the cluster
  # without Gateway/VirtualService host collisions.
  hostSuffix: ""
