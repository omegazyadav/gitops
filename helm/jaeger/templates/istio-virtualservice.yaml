{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: jaeger
  namespace: {{ .Release.Namespace }}
spec:
  hosts:
    - {{ .Values.istio.host }}
  gateways:
    - jaeger
  http:
    - route:
        - destination:
            host: jaeger.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 16686
{{- end }}
