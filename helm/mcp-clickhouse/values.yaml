image:
  repository: ghcr.io/clickhouse/mcp-clickhouse
  tag: latest
  pullPolicy: IfNotPresent

replicas: 1

clickhouse:
  host: clickhouse-clickhouse-headless.clickhouse.svc.cluster.local
  port: 8123
  user: mcp_service
  password: "changeme-mcp"
  secure: false
  verify: false
  allowWriteAccess: false
  allowDrop: false

auth:
  # Static bearer token clients must send as `Authorization: Bearer <token>`.
  token: "changeme-mcp-token"

service:
  port: 8000

resources:
  requests:
    cpu: "0.1"
    memory: "128Mi"
  limits:
    memory: "256Mi"

istio:
  enabled: true
  host: mcp-clickhouse.localhost
