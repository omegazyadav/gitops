apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: mcp-clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: clickhouse-password
            - name: CLICKHOUSE_SECURE
              value: {{ .Values.clickhouse.secure | quote }}
            - name: CLICKHOUSE_VERIFY
              value: {{ .Values.clickhouse.verify | quote }}
            - name: CLICKHOUSE_ALLOW_WRITE_ACCESS
              value: {{ .Values.clickhouse.allowWriteAccess | quote }}
            - name: CLICKHOUSE_ALLOW_DROP
              value: {{ .Values.clickhouse.allowDrop | quote }}
            - name: CLICKHOUSE_MCP_SERVER_TRANSPORT
              value: "http"
            - name: CLICKHOUSE_MCP_BIND_HOST
              value: "0.0.0.0"
            - name: CLICKHOUSE_MCP_BIND_PORT
              value: {{ .Values.service.port | quote }}
            - name: CLICKHOUSE_MCP_ALLOWED_HOSTS
              value: {{ printf "%s,%s:*,%s.%s.svc.cluster.local:*" .Values.istio.host .Values.istio.host .Release.Name .Release.Namespace | quote }}
            - name: CLICKHOUSE_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: auth-token
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
