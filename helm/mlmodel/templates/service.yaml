apiVersion: v1
kind: Service
metadata:
  name: {{ include "mlmodel.fullname" . }}
  namespace: {{ include "mlmodel.namespace" . }}
  labels:
    {{- include "mlmodel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mlmodel.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
