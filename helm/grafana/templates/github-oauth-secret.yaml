apiVersion: v1
kind: Secret
metadata:
  name: grafana-github-oauth
type: Opaque
stringData:
  # Real values must be supplied via a SOPS-encrypted values file (see
  # helm/grafana/secrets.enc.yaml and the root README's Secrets Management
  # section). Never commit real client_id/client_secret values to git.
  client_id: {{ .Values.githubOAuth.clientId | quote }}
  client_secret: {{ .Values.githubOAuth.clientSecret | quote }}
