# Values for the upstream grafana-mcp subchart (https://github.com/grafana/helm-charts/tree/main/charts/grafana-mcp)
grafana-mcp:
  image:
    tag: "1.3.0"
  grafana:
    url: http://grafana.grafana.svc.cluster.local
    apiKeySecret:
      name: mcp-grafana-credentials
      key: apiKey

  extraArgs:
    - "-t"
    - "streamable-http"
    - "--allowed-hosts"
    - "mcp-grafana.localhost,mcp-grafana.localhost:8080"
    - "--enabled-tools"
    - "search,datasource,incident,prometheus,loki,alerting,dashboard,folder,oncall,asserts,sift,pyroscope,navigation,proxied,annotations,rendering,clickhouse"

  resources:
    requests:
      cpu: "0.1"
      memory: "128Mi"
    limits:
      memory: "256Mi"

# Grafana service account token.
# Real value supplied via secrets.enc.yaml (sops).
credentials:
  apiKey: ""

istio:
  enabled: true
  host: mcp-grafana.localhost
