apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-secret
type: Opaque
stringData:
  # Real value must be supplied via --set slack.webhookUrl=... or a
  # local (gitignored) values file, e.g. values.secrets.yaml. Never commit
  # the real Slack webhook URL to git.
  slack-api-url: {{ .Values.slack.webhookUrl | quote }}
