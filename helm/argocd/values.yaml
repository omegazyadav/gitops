argo-cd:
  configs:
    params:
      server.insecure: true
    cm:
      helm.valuesFileSchemes: "secrets, https"

  server:
    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: argocd.localhost

    extraArgs:
      - --insecure

  repoServer:
    env:
      - name: HELM_PLUGINS
        value: /custom-tools/helm-plugins/
      - name: HELM_SECRETS_SOPS_PATH
        value: /custom-tools/sops
      - name: HELM_SECRETS_KUBECTL_PATH
        value: /usr/local/bin/kubectl
      - name: HELM_SECRETS_HELM_PATH
        value: /usr/local/bin/helm.bin
      - name: HELM_SECRETS_BACKEND
        value: sops
      - name: HELM_SECRETS_WRAPPER_ENABLED
        value: "true"
      - name: HELM_SECRETS_DECRYPT_SECRETS_IN_TMP_DIR
        value: "true"
      - name: SOPS_AGE_SSH_PRIVATE_KEY_FILE
        value: /age-key/id_rsa

    volumes:
      - name: custom-tools
        emptyDir: {}
      - name: age-key
        secret:
          secretName: argocd-repo-server-age-key
          defaultMode: 0400

    volumeMounts:
      - name: custom-tools
        mountPath: /custom-tools
      - name: custom-tools
        mountPath: /usr/local/bin/helm
        subPath: helm
      - name: custom-tools
        mountPath: /usr/local/bin/helm.bin
        subPath: helm.bin
      - name: age-key
        mountPath: /age-key
        readOnly: true

    initContainers:
      - name: download-helm-secrets
        image: alpine/helm:3.16.4
        imagePullPolicy: IfNotPresent
        command: [sh, -ec]
        env:
          - name: HELM_SECRETS_VERSION
            value: "4.6.2"
          - name: SOPS_VERSION
            value: "3.9.4"
        args:
          - |
            mkdir -p /custom-tools/helm-plugins
            wget -qO /custom-tools/sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
            wget -qO- "https://github.com/jkroepke/helm-secrets/releases/download/v${HELM_SECRETS_VERSION}/helm-secrets.tar.gz" | tar -C /custom-tools/helm-plugins -xzf-
            cp -fp "$(which helm)" /custom-tools/helm.bin
            cp /custom-tools/helm-plugins/helm-secrets/scripts/wrapper/helm.sh /custom-tools/helm
            chmod +x /custom-tools/sops /custom-tools/helm /custom-tools/helm.bin
        volumeMounts:
          - name: custom-tools
            mountPath: /custom-tools
