mlflow:
  replicaCount: 1

  postgresql:
    enabled: true
    architecture: standalone
    auth:
      username: mlflow
      password: mlflow-secret
      database: mlflow
    primary:
      persistence:
        enabled: true
        storageClassName: standard
        size: 2Gi

  artifactRoot:
    defaultArtifactRoot: /mlflow/artifacts

  extraVolumes:
    - name: mlflow-artifacts
      persistentVolumeClaim:
        claimName: mlflow-artifacts

  extraVolumeMounts:
    - name: mlflow-artifacts
      mountPath: /mlflow/artifacts

  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: mlflow.localhost
        paths:
          - path: /
            pathType: Prefix

  extraArgs:
    workers: 2

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
