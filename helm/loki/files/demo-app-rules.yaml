groups:
  - name: demo-app-log-alerts
    rules:
      - alert: DemoAppFrequentStatusPolling
        expr: |
          sum(count_over_time({service_name="demo-app"} | json | path="/status" [1m])) > 5
        for: 1m
        labels:
          severity: info
          namespace: monitoring
          app: demo-app
        annotations:
          summary: "demo-app /status endpoint is being polled frequently"
          description: "{{ $value }} \"/status\" requests logged by demo-app in the last minute (threshold: 5)."
          grafana_url: 'http://grafana.localhost:9999/explore?orgId=1&left=%7B%22datasource%22%3A%20%22loki%22%2C%20%22queries%22%3A%20%5B%7B%22refId%22%3A%20%22A%22%2C%20%22expr%22%3A%20%22%7Bservice_name%3D%5C%22demo-app%5C%22%7D%20%7C%20json%20%7C%20path%3D%5C%22/status%5C%22%22%2C%20%22queryType%22%3A%20%22range%22%7D%5D%2C%20%22range%22%3A%20%7B%22from%22%3A%20%22now-1h%22%2C%20%22to%22%3A%20%22now%22%7D%7D'

      - alert: DemoAppRequestHandledVolume
        expr: |
          sum(count_over_time({service_name="demo-app"} | json | msg="request handled" [1m])) > 15
        for: 1m
        labels:
          severity: info
          namespace: monitoring
          app: demo-app
        annotations:
          summary: "demo-app is logging a high volume of handled requests"
          description: "{{ $value }} \"request handled\" log lines from demo-app in the last minute (threshold: 15)."
          grafana_url: 'http://grafana.localhost:9999/explore?orgId=1&left=%7B%22datasource%22%3A%20%22loki%22%2C%20%22queries%22%3A%20%5B%7B%22refId%22%3A%20%22A%22%2C%20%22expr%22%3A%20%22%7Bservice_name%3D%5C%22demo-app%5C%22%7D%20%7C%20json%20%7C%20msg%3D%5C%22request%20handled%5C%22%22%2C%20%22queryType%22%3A%20%22range%22%7D%5D%2C%20%22range%22%3A%20%7B%22from%22%3A%20%22now-1h%22%2C%20%22to%22%3A%20%22now%22%7D%7D'
