groups:
  - name: infra-log-alerts
    rules:
      - alert: InfraForbiddenErrorVolume
        expr: |
          sum by (service_name) (count_over_time({service_name="grafana"} |~ "(?i)forbidden" [1m])) > 0
        for: 1m
        labels:
          severity: info
          namespace: monitoring
          source: infra-log-alert
        annotations:
          summary: "Grafana is logging RBAC \"forbidden\" errors"
          description: "{{ $value }} \"forbidden\" log lines from service \"{{ $labels.service_name }}\" in the last minute."
          grafana_url: 'http://grafana.localhost:9999/explore?orgId=1&left=%7B%22datasource%22%3A%20%22loki%22%2C%20%22queries%22%3A%20%5B%7B%22refId%22%3A%20%22A%22%2C%20%22expr%22%3A%20%22sum%20by%20%28service_name%29%20%28count_over_time%28%7Bservice_name%3D%5C%22grafana%5C%22%7D%20%7C~%20%5C%22%28%3Fi%29forbidden%5C%22%20%5B1m%5D%29%29%22%2C%20%22queryType%22%3A%20%22range%22%7D%5D%2C%20%22range%22%3A%20%7B%22from%22%3A%20%22now-1h%22%2C%20%22to%22%3A%20%22now%22%7D%7D'
